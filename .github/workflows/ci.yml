name: Moviqo Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: moviqo
          POSTGRES_USER: moviqo
          POSTGRES_PASSWORD: moviqo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moviqo -d moviqo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: Moviqo.Back
    env:
      MOVIQO_SECRET_KEY: ci-only-contract-key-with-sufficient-length-and-entropy-2026
      MOVIQO_ALLOWED_HOSTS: localhost,testserver
      MOVIQO_DB_NAME: moviqo
      MOVIQO_DB_USER: moviqo
      MOVIQO_DB_PASSWORD: moviqo
      MOVIQO_DB_HOST: localhost
      MOVIQO_DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: Moviqo.Back/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest
      - name: Run environment and data-protection release gate evidence
        run: >-
          uv run pytest
          tests/unit/test_production_contract.py
          tests/unit/test_diagnostic_redaction.py
          tests/contract/test_problem_details_contract.py
      - run: uv run python src/manage.py spectacular --file ../docs/api/openapi-v1.json --format openapi-json --validate --fail-on-warn --settings=moviqo.settings.test
      - run: git ls-files --error-unmatch docs/api/openapi-v1.json
        working-directory: .
      - run: git diff --exit-code -- ../docs/api/openapi-v1.json
      - run: uv run python src/manage.py makemigrations --settings=moviqo.settings.test --check --dry-run
      - name: Run tenant isolation release gate registration checks
        run: >-
          uv run pytest
          tests/architecture/test_backend_spine_contract.py::test_tenant_owned_tables_are_registered_for_rls_enforcement
          tests/architecture/test_backend_spine_contract.py::test_tenant_isolation_gate_registration_matches_rls_registration
          tests/contract/test_organization_tenant_contract.py::test_protected_membership_endpoint_hides_cross_tenant_resources
          tests/contract/test_organization_tenant_contract.py::test_protected_membership_endpoint_rejects_ambiguous_membership_selection
      - run: uv run python src/manage.py migrate --settings=moviqo.settings.integration --noinput
      - name: Run tenant isolation release gate integration evidence
        run: uv run pytest tests/integration/test_tenant_isolation.py --ds=moviqo.settings.integration
      - run: uv run pytest tests/integration --ds=moviqo.settings.integration
      - name: Run production startup security gate
        run: uv run python src/manage.py check --deploy --settings=moviqo.settings.production
        env:
          MOVIQO_ALLOWED_HOSTS: app.moviqo.example,api.moviqo.example
          MOVIQO_CSRF_TRUSTED_ORIGINS: https://app.moviqo.example,https://api.moviqo.example
          MOVIQO_TRUST_X_FORWARDED_PROTO: "true"
          MOVIQO_GCS_PRIVATE_BUCKET: moviqo-private-files
          MOVIQO_GCS_QUARANTINE_BUCKET: moviqo-quarantine-files
          MOVIQO_GCS_CLEAN_BUCKET: moviqo-clean-files
          MOVIQO_RESEND_API_KEY: ci-only-resend-key
          MOVIQO_RESEND_FROM_EMAIL: Moviqo <notifications@updates.mymoviqo.com>
      - run: uv run python src/manage.py health_start

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moviqo.Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: Moviqo.Front/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run check:node
      - run: npm run test:architecture
      - run: npm run check:api-client
      - run: npm run test:unit
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  preview-qualification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moviqo.Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: Moviqo.Front/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:preview-qualification
      - name: Upload preview qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qualification-${{ github.sha }}
          path: Moviqo.Front/test-results
          if-no-files-found: ignore
          retention-days: 7

  deployed-journey:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_DEPLOYED_JOURNEY: "1"
      MOVIQO_E2E_BASE_URL: ${{ vars.MOVIQO_E2E_BASE_URL }}
      MOVIQO_E2E_SYNTHETIC_KEY: ${{ secrets.MOVIQO_E2E_SYNTHETIC_KEY }}
      MOVIQO_E2E_BUILD_ID: ${{ github.sha }}
    steps:
      - name: Check deployed journey configuration
        run: |
          if [ -z "${MOVIQO_E2E_BASE_URL}" ] || [ -z "${MOVIQO_E2E_SYNTHETIC_KEY}" ]; then
            echo "The deployed journey requires MOVIQO_E2E_BASE_URL and MOVIQO_E2E_SYNTHETIC_KEY."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
          cache-dependency-path: Moviqo.Front/package-lock.json
      - working-directory: Moviqo.Front
        run: npm ci --legacy-peer-deps
      - working-directory: Moviqo.Front
        run: npx playwright install --with-deps chromium
      - working-directory: Moviqo.Front
        run: npm run test:e2e:deployed-journey
      - name: Upload sanitized deployed-journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-journey-${{ github.sha }}
          path: Moviqo.Front/test-results
          if-no-files-found: ignore
          retention-days: 7

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run environment separation and managed-secret infrastructure gate
        run: python Moviqo.Infrastructure/operations/validate_uat.py
